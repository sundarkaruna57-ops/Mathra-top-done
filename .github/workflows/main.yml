name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - run: flutter pub get

      # Gradle downloads sometimes fail with 502/504, so retry a few times.
      - name: Build APK (with retries)
        run: |
          for attempt in 1 2 3; do
            if flutter build apk --release; then exit 0; fi
            echo "Attempt $attempt failed, retrying..."
            sleep $((attempt * 45))
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: pipes-apk
          path: build/app/outputs/flutter-apk/app-release.apk
